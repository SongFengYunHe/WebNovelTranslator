<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      渲染进程策略。说明：
      - style-src 保留 'unsafe-inline'，因为 React 会写入行内 `style` 属性
        （离线下载进度条）；移除它会破坏该功能。
      - frame-src 仅允许 https:：浏览器标签页的 <webview> 是唯一的 frame，
        且主进程同样会拒绝非 HTTPS 的附着。
      - frame-ancestors / sandbox 被有意省略——这些指令经 <meta> 传递时会被忽略，
        声明它们只会暗示一种实际上并未生效的保护。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'self' file:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>网文翻译器</title>
    <link rel="stylesheet" href="../dist/renderer/renderer.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="../dist/renderer/renderer.js"></script>
  </body>
</html>
